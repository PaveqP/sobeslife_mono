services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Browser calls this URL; use the host/port where the Go API is reachable (see README).
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - app

  app:
    build: ./server
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTH_GOOGLE_REDIRECT_URI=http://localhost:5173/auth/google
  db:
    image: postgres:16
    container_name: sobeslife-db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: sobeslife-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
