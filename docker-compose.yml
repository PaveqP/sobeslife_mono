services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      # Browser calls this URL; use the host/port where the Go API is reachable (see README).
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - app

  app:
    build: ./server
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - OAUTH_GOOGLE_REDIRECT_URI=http://localhost:5173/auth/google
      # Каталог SQL-миграций в образе сервера (см. server/dockerfile WORKDIR /app).
      - MIGRATIONS_PATH=/app/migrations
      # Сбой dirty (один раз): в корневом .env — MIGRATE_CLEAR_DIRTY=true, затем docker compose up --force-recreate app
      - MIGRATE_CLEAR_DIRTY=${MIGRATE_CLEAR_DIRTY:-false}
      # При необходимости: SKIP_DB_MIGRATIONS=true — не запускать golang-migrate при старте.
  db:
    image: postgres:16
    container_name: sobeslife-db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
    ports:
      - "5454:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Схема создаётся golang-migrate при старте app; не монтируйте сюда полный SQL-дамп с тем же DDL.
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 5s
      retries: 15
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: sobeslife-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile.dev
    # Bind-mount с хоста сбрасывает +x; запуск через sh не требует исполняемого бита.
    entrypoint: ["sh", "/usr/local/bin/docker-entrypoint.dev.sh"]
    # Иначе CMD из образа не всегда попадает в $@ entrypoint — контейнер выходит с 0 без Vite.
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5174"]
    ports:
      - "5174:5174"
    environment:
      - VITE_ADMIN_API_URL=${VITE_API_URL:-http://localhost:8080}
    volumes:
      - ./admin:/app
      # Скрипт в образе в /usr/local/bin; без этого bind правки entrypoint требуют docker compose build admin.
      - ./admin/docker-entrypoint.dev.sh:/usr/local/bin/docker-entrypoint.dev.sh:ro
      - admin_node_modules:/app/node_modules
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
  web_node_modules:
  admin_node_modules:
