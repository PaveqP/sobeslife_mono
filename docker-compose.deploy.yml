# Dev / staging stand: full stack behind nginx on port 80 (SPA + API same origin).
# Usage: docker compose -f docker-compose.deploy.yml --env-file .env up -d --build

services:
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build:
      context: ./server
      dockerfile: dockerfile
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    environment:
      OAUTH_GOOGLE_REDIRECT_URI: https://dev.sobeslife.ru/auth/google

  db:
    image: postgres:16
    container_name: sobeslife-db
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sobeslife-redis
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
