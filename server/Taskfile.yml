version: "3"

tasks:
  run:
    desc: "Запустить проект"
    cmds:
      - go run cmd/application/main.go -config config/config.yaml
  start-db:
    desc: "Запустить контейнер БД"
    cmds:
      - docker run --name=sobeslife-db -e POSTGRES_DB=sobeslife_db -e POSTGRES_PASSWORD='paveq123' -d --rm -p 5454:5432 postgres
  backup-db:
    desc: "Сделать бэкап базы данных"
    cmds:
      - docker-compose exec -T db pg_dump -U postgres postgres > backup_$(date +%Y%m%d_%H%M%S).sql
  apply-backup:
    cmds:
      - docker compose exec -T db psql -U postgres postgres < postgres-init/db_dump.sql


