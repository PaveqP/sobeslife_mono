# Production: static SPA + reverse proxy to Go API (same origin for the browser).
# Service name `app` — DNS в Docker (127.0.0.11). Переменная в proxy_pass + resolver нужны,
# иначе nginx резолвит `app` только при старте и падает с «host not found», если app ещё не поднят.
# Явный $request_uri при динамическом upstream — надёжнее передаёт метод/тело (известные случаи 502).

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location /api/ {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /auth/google {
        try_files /index.html =404;
    }

    location = /auth/github {
        try_files /index.html =404;
    }

    location /auth/ {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        set $upstream_app app;
        proxy_pass http://$upstream_app:8080$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
