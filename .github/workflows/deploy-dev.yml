# Deploy dev stand: push to `dev` → SSH to server, pull, rebuild stack.
#
# Required GitHub repository secrets:
#   DEV_SSH_HOST       — server hostname or IP
#   DEV_SSH_USER       — e.g. deploy
#   DEV_SSH_PRIVATE_KEY — full PEM private key (include BEGIN/END lines)
#   DEV_DEPLOY_PATH    — absolute path to repo on server, e.g. /opt/sobeslife
#   DEV_DB_PASSWORD
#   DEV_CONFIG_PATH
#   DEV_ACCESS_SIGNING_KEY
#   DEV_REFRESH_SIGNING_KEY
#   DEV_POLZA_AI_API_KEY
#   DEV_OAUTH_GOOGLE_CLIENT_SECRET
#   DEV_OAUTH_GOOGLE_CLIENT_ID
#   DEV_OAUTH_GOOGLE_REDIRECT_URI
# Optional GitHub repository secrets:
#   DEV_HTTP_PORT
#   DEV_VITE_API_URL

name: Deploy dev stand

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd "${{ secrets.DEV_DEPLOY_PATH }}"
            git config --global --add safe.directory "$(pwd)" || true
            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev
            umask 077
            cat > .env <<'EOF'
            DB_PASSWORD=${{ secrets.DEV_DB_PASSWORD }}
            CONFIG_PATH=${{ secrets.DEV_CONFIG_PATH }}
            ACCESS_SIGNING_KEY=${{ secrets.DEV_ACCESS_SIGNING_KEY }}
            REFRESH_SIGNING_KEY=${{ secrets.DEV_REFRESH_SIGNING_KEY }}
            POLZA_AI_API_KEY=${{ secrets.DEV_POLZA_AI_API_KEY }}
            OAUTH_GOOGLE_CLIENT_SECRET=${{ secrets.DEV_OAUTH_GOOGLE_CLIENT_SECRET }}
            OAUTH_GOOGLE_CLIENT_ID=${{ secrets.DEV_OAUTH_GOOGLE_CLIENT_ID }}
            OAUTH_GOOGLE_REDIRECT_URI=${{ secrets.DEV_OAUTH_GOOGLE_REDIRECT_URI }}
            HTTP_PORT=${{ secrets.DEV_HTTP_PORT }}
            VITE_API_URL=${{ secrets.DEV_VITE_API_URL }}
            EOF
            docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
            docker compose -f docker-compose.deploy.yml --env-file .env ps
