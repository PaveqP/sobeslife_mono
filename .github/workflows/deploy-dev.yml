# Deploy dev stand: push to `dev` → run tests → SSH to server, pull, rebuild stack.
#
# Required GitHub repository secrets:
#   DEV_SSH_HOST            — server hostname or IP
#   DEV_SSH_USER            — e.g. deploy
#   DEV_SSH_PRIVATE_KEY     — full PEM private key (include BEGIN/END lines)
#   DEV_DEPLOY_PATH         — absolute path to repo on server, e.g. /opt/sobeslife
#   DEV_DB_PASSWORD
#   DEV_CONFIG_PATH
#   DEV_ACCESS_SIGNING_KEY
#   DEV_REFRESH_SIGNING_KEY
#   DEV_POLZA_AI_API_KEY
#   DEV_OAUTH_GOOGLE_CLIENT_SECRET
#   DEV_OAUTH_GOOGLE_CLIENT_ID
#   DEV_OAUTH_GOOGLE_REDIRECT_URI
# Optional GitHub repository secrets:
#   DEV_HTTP_PORT
#   DEV_VITE_API_URL

name: Deploy dev stand

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  test-web:
    name: Web Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  test-admin:
    name: Admin Unit Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - run: npm install
      - name: Native bindings for Linux (Rolldown + Lightning CSS)
        run: |
          npm install \
            "@rolldown/binding-linux-x64-gnu@$(node -p "require('./node_modules/rolldown/package.json').version")" \
            "lightningcss-linux-x64-gnu@$(node -p "require('./node_modules/lightningcss/package.json').version")"
      - run: npm run typecheck
      - run: npm test

  test-mobile:
    name: Mobile Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  test-server:
    name: Server Go Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: server/go.sum
      - run: go build ./...
      - run: go test ./... -v -count=1

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-web, test-admin, test-mobile, test-server]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - name: Install web dependencies
        run: npm ci
        working-directory: web
      - name: Build web app
        run: npm run build
        working-directory: web
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json
      - name: Install admin dependencies
        run: npm install
        working-directory: admin
      # Lockfile с macOS не подтягивает optional native deps для Linux (rolldown, lightningcss/Tailwind 4)
      - name: Native bindings for Linux (Rolldown + Lightning CSS)
        run: |
          npm install \
            "@rolldown/binding-linux-x64-gnu@$(node -p "require('./node_modules/rolldown/package.json').version")" \
            "lightningcss-linux-x64-gnu@$(node -p "require('./node_modules/lightningcss/package.json').version")"
        working-directory: admin
      - name: Build admin app
        run: npm run build
        working-directory: admin
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json
      - name: Install e2e dependencies
        run: npm ci
        working-directory: e2e
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Serve web and admin builds and run Playwright tests
        run: |
          # Web: static SPA (base "/"). Admin: base "/admin/" — assets are /admin/assets/* on disk under dist/assets/;
          # plain "serve" maps URLs wrong and returns 404 for JS. Vite preview respects base.
          npx serve ../web/dist -s -l 5173 &
          (cd ../admin && npm run preview -- --port 5174 --host 127.0.0.1) &
          sleep 6
          BASE_URL=http://localhost:5173 ADMIN_BASE_URL=http://localhost:5174 npx playwright test --project=chromium
        working-directory: e2e

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [e2e]
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEV_DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          DEV_CONFIG_PATH: ${{ secrets.DEV_CONFIG_PATH }}
          DEV_ACCESS_SIGNING_KEY: ${{ secrets.DEV_ACCESS_SIGNING_KEY }}
          DEV_REFRESH_SIGNING_KEY: ${{ secrets.DEV_REFRESH_SIGNING_KEY }}
          DEV_POLZA_AI_API_KEY: ${{ secrets.DEV_POLZA_AI_API_KEY }}
          DEV_OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.DEV_OAUTH_GOOGLE_CLIENT_SECRET }}
          DEV_OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.DEV_OAUTH_GOOGLE_CLIENT_ID }}
          DEV_OAUTH_GOOGLE_REDIRECT_URI: ${{ secrets.DEV_OAUTH_GOOGLE_REDIRECT_URI }}
          DEV_HTTP_PORT: ${{ secrets.DEV_HTTP_PORT }}
          DEV_VITE_API_URL: ${{ secrets.DEV_VITE_API_URL }}
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}                                                                                                                                                                                              
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}                                                                                                                                                                                      
          OAUTH_GITHUB_REDIRECT_URI: ${{ secrets.OAUTH_GITHUB_REDIRECT_URI }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
        with:
          host: ${{ secrets.DEV_SSH_HOST }}
          username: ${{ secrets.DEV_SSH_USER }}
          key: ${{ secrets.DEV_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEV_DB_PASSWORD,DEV_CONFIG_PATH,DEV_ACCESS_SIGNING_KEY,DEV_REFRESH_SIGNING_KEY,DEV_POLZA_AI_API_KEY,DEV_OAUTH_GOOGLE_CLIENT_SECRET,DEV_OAUTH_GOOGLE_CLIENT_ID,DEV_OAUTH_GOOGLE_REDIRECT_URI,DEV_HTTP_PORT,DEV_VITE_API_URL
          script: |
            set -eu
            cd "${{ secrets.DEV_DEPLOY_PATH }}"
            git config --global --add safe.directory "$(pwd)" || true
            git fetch origin dev
            git checkout dev
            git pull --ff-only origin dev

            [ -n "${DEV_DB_PASSWORD:-}" ] || { echo "Missing required deploy variable: DEV_DB_PASSWORD" >&2; exit 1; }
            [ -n "${DEV_CONFIG_PATH:-}" ] || { echo "Missing required deploy variable: DEV_CONFIG_PATH" >&2; exit 1; }
            [ -n "${DEV_ACCESS_SIGNING_KEY:-}" ] || { echo "Missing required deploy variable: DEV_ACCESS_SIGNING_KEY" >&2; exit 1; }
            [ -n "${DEV_REFRESH_SIGNING_KEY:-}" ] || { echo "Missing required deploy variable: DEV_REFRESH_SIGNING_KEY" >&2; exit 1; }
            [ -n "${DEV_POLZA_AI_API_KEY:-}" ] || { echo "Missing required deploy variable: DEV_POLZA_AI_API_KEY" >&2; exit 1; }
            [ -n "${DEV_OAUTH_GOOGLE_CLIENT_SECRET:-}" ] || { echo "Missing required deploy variable: DEV_OAUTH_GOOGLE_CLIENT_SECRET" >&2; exit 1; }
            [ -n "${DEV_OAUTH_GOOGLE_CLIENT_ID:-}" ] || { echo "Missing required deploy variable: DEV_OAUTH_GOOGLE_CLIENT_ID" >&2; exit 1; }
            [ -n "${DEV_OAUTH_GOOGLE_REDIRECT_URI:-}" ] || { echo "Missing required deploy variable: DEV_OAUTH_GOOGLE_REDIRECT_URI" >&2; exit 1; }
            [ -n "${OAUTH_GITHUB_CLIENT_ID:-}" ] || { echo "Missing required deploy variable: OAUTH_GITHUB_CLIENT_ID" >&2; exit 1; }
            [ -n "${OAUTH_GITHUB_CLIENT_SECRET:-}" ] || { echo "Missing required deploy variable: OAUTH_GITHUB_CLIENT_SECRET" >&2; exit 1; }
            [ -n "${OAUTH_GITHUB_REDIRECT_URI:-}" ] || { echo "Missing required deploy variable: OAUTH_GITHUB_REDIRECT_URI" >&2; exit 1; }
            [ -n "${RESEND_API_KEY:-}" ] || { echo "Missing required deploy variable: RESEND_API_KEY" >&2; exit 1; }
            [ -n "${RESEND_FROM_EMAIL:-}" ] || { echo "Missing required deploy variable: RESEND_FROM_EMAIL" >&2; exit 1; }

            umask 077
            : > .env
            printf 'DB_PASSWORD=%s\n' "$DEV_DB_PASSWORD" >> .env
            printf 'CONFIG_PATH=%s\n' "$DEV_CONFIG_PATH" >> .env
            printf 'ACCESS_SIGNING_KEY=%s\n' "$DEV_ACCESS_SIGNING_KEY" >> .env
            printf 'REFRESH_SIGNING_KEY=%s\n' "$DEV_REFRESH_SIGNING_KEY" >> .env
            printf 'POLZA_AI_API_KEY=%s\n' "$DEV_POLZA_AI_API_KEY" >> .env
            printf 'OAUTH_GOOGLE_CLIENT_SECRET=%s\n' "$DEV_OAUTH_GOOGLE_CLIENT_SECRET" >> .env
            printf 'OAUTH_GOOGLE_CLIENT_ID=%s\n' "$DEV_OAUTH_GOOGLE_CLIENT_ID" >> .env
            printf 'OAUTH_GOOGLE_REDIRECT_URI=%s\n' "$DEV_OAUTH_GOOGLE_REDIRECT_URI" >> .env
            if [ -n "${DEV_HTTP_PORT:-}" ]; then printf 'HTTP_PORT=%s\n' "$DEV_HTTP_PORT" >> .env; fi
            if [ -n "${DEV_VITE_API_URL:-}" ]; then printf 'VITE_API_URL=%s\n' "$DEV_VITE_API_URL" >> .env; fi
            printf 'OAUTH_GITHUB_CLIENT_ID=%s\n' "$OAUTH_GITHUB_CLIENT_ID" >> .env
            printf 'OAUTH_GITHUB_CLIENT_SECRET=%s\n' "$OAUTH_GITHUB_CLIENT_SECRET" >> .env
            printf 'OAUTH_GITHUB_REDIRECT_URI=%s\n' "$OAUTH_GITHUB_REDIRECT_URI" >> .env
            printf 'RESEND_API_KEY=%s\n' "$RESEND_API_KEY" >> .env
            printf 'RESEND_FROM_EMAIL=%s\n' "$RESEND_FROM_EMAIL" >> .env
            docker compose -f docker-compose.deploy.yml --env-file .env up -d --build
            docker compose -f docker-compose.deploy.yml --env-file .env ps
